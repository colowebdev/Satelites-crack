<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi bitácora - Bitacora de Suenos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="barra-nav">
    <h1 class="marca">bitácora <span>de sueños</span></h1>
    <div class="nav-derecha">
      <span class="saludo" id="saludoUsuario"></span>
      <button class="boton-salir" id="btnSalir">Cerrar sesión</button>
    </div>
  </nav>

  <div class="panel">
    <div class="panel-encabezado">
      <h1>Mi bitácora de sueños</h1>
      <p>Registra, ordena y filtra los sueños que quieras recordar.</p>
    </div>

    <div class="tarjeta-formulario">
      <h2 id="tituloFormulario">Nuevo sueño</h2>
      <form id="formSueno">
        <input type="hidden" id="suenoId">
        <div class="grid-form">
          <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>
          </div>
          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="Normal">Normal</option>
              <option value="Pesadilla">Pesadilla</option>
              <option value="Lúcido">Lúcido</option>
              <option value="Premonitorio">Premonitorio</option>
              <option value="Fragmentado">Fragmentado</option>
            </select>
          </div>
          <div class="campo">
            <label for="emocionPrincipal">Emoción principal</label>
            <input type="text" id="emocionPrincipal" placeholder="Miedo, calma, euforia...">
          </div>
          <div class="campo">
            <label for="personaPrincipal">Persona principal</label>
            <input type="text" id="personaPrincipal">
          </div>
          <div class="campo">
            <label for="lugarPrincipal">Lugar principal</label>
            <input type="text" id="lugarPrincipal">
          </div>
          <div class="campo">
            <label for="nivelClaridad">Nivel de claridad (1-10)</label>
            <input type="number" id="nivelClaridad" min="1" max="10">
          </div>
          <div class="campo">
            <div class="check-line" style="margin-top: 28px;">
              <input type="checkbox" id="recurrente">
              <label for="recurrente">Es un sueño recurrente</label>
            </div>
          </div>
          <div class="campo campo-full">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion"></textarea>
          </div>
        </div>
        <div class="fila-botones">
          <button type="submit" class="boton" id="btnGuardar">Guardar sueño</button>
          <button type="button" class="boton boton-secundario" id="btnCancelar" style="display:none;">Cancelar edición</button>
        </div>
      </form>
    </div>

    <div class="controles">
      <div class="campo">
        <label for="buscador">Buscar por título</label>
        <input type="text" id="buscador" placeholder="Escribe un título...">
      </div>
      <div class="campo">
        <label for="filtroTipo">Filtrar por tipo</label>
        <select id="filtroTipo">
          <option value="">Todos</option>
          <option value="Normal">Normal</option>
          <option value="Pesadilla">Pesadilla</option>
          <option value="Lúcido">Lúcido</option>
          <option value="Premonitorio">Premonitorio</option>
          <option value="Fragmentado">Fragmentado</option>
        </select>
      </div>
      <button class="boton" id="btnOrdenar" style="max-width:220px;">Ordenar por fecha</button>
    </div>

    <div class="grid-suenos" id="listaSuenos"></div>
  </div>

  <script src="js/sueno.js"></script>
</body>
</html>
