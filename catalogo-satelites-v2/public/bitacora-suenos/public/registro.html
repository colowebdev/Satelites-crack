<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Bitacora de Suenos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="contenedor-centrado">
    <div class="tarjeta-auth">
      <h1 class="marca">bitácora <span>de sueños</span></h1>
      <p class="subtitulo">La vida era más corta</p>

      <form id="formRegistro">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required>
        </div>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" required>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" required>
        </div>
        <div class="campo">
          <label for="confirmarClave">Confirmar contraseña</label>
          <input type="password" id="confirmarClave" required>
        </div>
        <button type="submit" class="boton">Crear cuenta</button>
        <p class="mensaje" id="mensaje"></p>
      </form>

      <p class="enlace-alterno">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
